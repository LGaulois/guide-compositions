<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Merci pour votre achat · Guide des Compositions</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:rgba(255,255,255,.1);--accent:#6366f1;--text:#f8fafc;--muted:#94a3b8;--ok:#22c55e;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
.box{max-width:560px;margin:6vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
h1{font-size:1.6rem;margin:0 0 8px}
p{color:var(--muted);margin:8px 0}
.code{font:700 1.4rem/1.2 ui-monospace,Consolas,monospace;letter-spacing:.08em;background:#0f172a;border:1px dashed var(--accent);border-radius:12px;padding:16px;text-align:center;margin:16px 0;word-break:break-all;user-select:all}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 20px;font:600 1rem inherit;background:var(--accent);color:#fff;text-decoration:none;cursor:pointer;margin:4px 6px 4px 0}
.btn.ghost{background:transparent;border:1px solid var(--line)}
ol{color:var(--muted);padding-left:20px}
.err{color:var(--bad)}
.note{font-size:.85rem}
</style>
</head>
<body>
<div class="box">
  <h1>Merci pour votre achat !</h1>
  <div id="st"><p>Vérification du paiement…</p></div>
</div>
<script>
// Adresse de la fonction « claim » (à renseigner une fois Supabase en place)
var CLAIM_URL = 'https://thrxnztptstexukfwurq.supabase.co/functions/v1/claim';
var st = document.getElementById('st');
function show(html){ st.innerHTML = html; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var WIN_URL = 'https://github.com/LGaulois/guide-compositions/releases/download/V1/Guide-des-Compositions-Installation-1.0.0.exe';
var sid = new URLSearchParams(location.search).get('session_id');
if (!CLAIM_URL) {
  show('<p class="err">Page en préparation : le serveur n\'est pas encore relié.</p>');
} else if (!sid) {
  show('<p class="err">Lien incomplet. Utilisez le lien affiché juste après votre paiement.</p>');
} else {
  fetch(CLAIM_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ session_id: sid }) })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if (j.status === 'ok') {
      show('<p>Voici votre code de licence. <strong>Notez-le ou gardez cette page</strong> : il ne fonctionne que sur un seul appareil (téléphone ou ordinateur).</p>' +
        '<div class="code" id="c">' + esc(j.key) + '</div>' +
        '<button class="btn ghost" id="cp" type="button">Copier le code</button>' +
        (j.download ? '<a class="btn" href="' + esc(j.download) + '">Télécharger pour Android</a>' : '<p class="err">Lien de téléchargement indisponible, rechargez la page.</p>') +
        '<a class="btn ghost" href="' + WIN_URL + '">Télécharger pour Windows</a>' +
        '<ol><li>Téléchargez le fichier sur votre téléphone Android et ouvrez-le.</li>' +
        '<li>Autorisez l\'installation d\'applications inconnues si Android le demande.</li>' +
        '<li>Dans l\'application, touchez « 🔑 Code de licence » et saisissez le code (internet requis une seule fois).</li></ol>' +
        '<p class="note">Windows : lancez le fichier téléchargé. Si Windows affiche « Windows a protégé votre PC », cliquez sur « Informations complémentaires » puis « Exécuter quand même ».</p>' +
        '<p class="note">Le lien Android dure 1 heure ; rechargez cette page pour en obtenir un nouveau.</p>');
      document.getElementById('cp').onclick = function(){ try { navigator.clipboard.writeText(j.key); this.textContent = 'Copié ✔'; } catch(e){} };
    } else if (j.status === 'unpaid') show('<p class="err">Le paiement n\'est pas encore confirmé. Patientez quelques secondes et rechargez la page.</p>');
    else if (j.status === 'refunded') show('<p class="err">Cet achat a été remboursé : le code n\'est plus valable.</p>');
    else show('<p class="err">Impossible de retrouver cet achat. Écrivez à legionnairegaulois@gmail.com en indiquant l\'e-mail utilisé pour payer.</p>' + (j.debug ? '<p class="note">Détail technique : ' + esc(JSON.stringify(j.debug)) + '</p>' : ''));
  })
  .catch(function(){ show('<p class="err">Connexion impossible. Rechargez la page.</p>'); });
}
</script>
</body>
</html>
